<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PhonePad Web</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>PhonePad Web</h1>
        <p>Telefonunu touchpad olarak kullan</p>
      </header>

      <section class="connect-panel">
        <label>
          Sunucu
          <input id="serverUrl" type="text" placeholder="ws://192.168.1.42:8766" />
        </label>
        <label>
          Token
          <input id="token" type="text" placeholder="Terminalde görünen token" />
        </label>

        <div class="actions">
          <button id="connectBtn">Bağlan</button>
          <button id="disconnectBtn" class="ghost" disabled>Kes</button>
        </div>

        <div id="status" class="status">Bağlı değil</div>
      </section>

      <section class="settings">
        <label>
          Sensitivity: <span id="sensValue">1.20</span>
          <input id="sensitivity" type="range" min="0.4" max="2.5" step="0.05" value="1.2" />
        </label>
        <label class="checkbox">
          <input type="checkbox" id="invertScroll" />
          Scroll yönünü ters çevir
        </label>
      </section>

      <section id="pad" class="touchpad">
        <div class="hint">
          <strong>Touchpad Alanı</strong>
          <small>1 parmak hareket, tek dokunma sol tık, iki parmak dokunma sağ tık, iki parmak sürükleme scroll.</small>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
